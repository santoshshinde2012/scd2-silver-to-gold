[project]
name = "gold-history-companion"
version = "1.0.0"
description = "Companion code for 'Silver Already Keeps History. Why Is Gold Building It Again?': three Gold history designs on local Delta tables."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Santosh Shinde" }]
dependencies = ["deltalake==1.6.6", "pyarrow>=17", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
